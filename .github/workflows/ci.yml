name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: [8, 11, 17, 21, 25]
        # Intel macOS retains the Java 8 baseline used by this project.
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn --batch-mode verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-${{ matrix.os }}-jdk${{ matrix.java }}
          path: '**/target/surefire-reports/**'
          if-no-files-found: warn

  redis-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: [8, 11, 17, 21, 25]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Start isolated Redis fixtures
        run: |
          sh scripts/redis-test-up.sh
          sh scripts/cluster-test-up.sh
          sh scripts/sentinel-test-up.sh
      - name: Standalone, Cluster and Sentinel compatibility
        run: >-
          mvn --batch-mode verify
          -Dboba.straw.runCompatibility=true
          -Dboba.straw.runCluster=true
          -Dboba.straw.runSentinel=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redis-integration-jdk${{ matrix.java }}
          path: '**/target/surefire-reports/**'
          if-no-files-found: warn
